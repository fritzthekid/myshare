<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share file (no server)</title>
<!--
  Purely client-side variant of sendfile: talks to Nextcloud directly from
  the browser via WebDAV/OCS API (no third instance/no own server needed,
  unlike cmd/webshare). Works from any network with internet access -
  provided Nextcloud allows browser access from this page's origin via
  CORS (see note below and README.md, section "Directly from the phone,
  without any server").

  Credentials (app password!) are only stored locally in the browser
  (localStorage), never transmitted anywhere except to your own Nextcloud
  instance.
-->

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<!--MYSHARE_CONFIG-->
<!--
  The comment above is a placeholder for deploy/gen-share-page.sh: the
  script replaces it with
    <script>window.MYSHARE_CONFIG = {...};</script>
  and thus produces a personalized copy of this page with baked-in
  credentials (e.g. for a specific phone) - then no input is needed
  anymore, just open the generated file. Without the generator (original
  share.html opened directly), window.MYSHARE_CONFIG stays undefined and
  the settings form below is used.
-->

<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --border: #dcdfe4;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --card: #242629;
      --text: #f1f1f1;
      --muted: #a3a3a3;
      --accent: #4f8dfd;
      --accent-text: #0b1220;
      --border: #3a3d42;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 480px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; text-align: center; }
  p.subtitle { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 0.95rem; margin: 0 0 12px; color: var(--muted); }
  label.field { display: block; font-size: 0.8rem; color: var(--muted); margin-top: 12px; }
  label.field:first-child { margin-top: 0; }
  input[type="text"], input[type="password"], input[type="number"] {
    width: 100%;
    padding: 12px;
    margin-top: 4px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font-size: 1rem;
  }
  #pick-label {
    display: block;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 28px 12px;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
    font-size: 1rem;
  }
  #pick-label.has-file { color: var(--text); border-style: solid; }
  #file-input { display: none; }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.link {
    background: none;
    color: var(--accent);
    font-weight: 500;
    font-size: 0.85rem;
    padding: 4px;
    margin-top: 8px;
    width: auto;
  }
  #status { text-align: center; color: var(--muted); margin-top: 12px; min-height: 1.2em; white-space: pre-wrap; }
  #status.error { color: var(--error); }
  #result { display: none; text-align: center; }
  #qr { display: flex; justify-content: center; margin: 8px 0 16px; }
  #qr img { background: #fff; border-radius: 12px; padding: 12px; }
  #link { word-break: break-all; font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>Share file</h1>
  <p class="subtitle">Runs entirely in the browser, no own server - talks directly to Nextcloud.</p>

  <div class="card" id="settings-card">
    <h2>Nextcloud access</h2>
    <label class="field">Server URL<input type="text" id="cfg-base-url" placeholder="https://cloud.example.com"></label>
    <label class="field">Username<input type="text" id="cfg-username" autocomplete="username"></label>
    <label class="field">App password (not the account password!)<input type="password" id="cfg-password" autocomplete="current-password"></label>
    <details>
      <summary>Advanced</summary>
      <label class="field">Target folder<input type="text" id="cfg-target-dir" placeholder="/PrinterUploads"></label>
      <label class="field">Link valid for (days)<input type="number" id="cfg-expire-days" min="1" placeholder="1"></label>
    </details>
    <button id="save-settings-btn">Save</button>
  </div>

  <div class="card" id="form-card" style="display:none">
    <label id="pick-label" for="file-input">Choose file …</label>
    <input type="file" id="file-input">
    <input type="text" id="label-input" placeholder="Title (optional)">
    <button id="send-btn" disabled>Send</button>
    <button id="edit-settings-btn" class="link">Change access</button>
    <div id="status"></div>
  </div>

  <div class="card" id="result">
    <div id="qr"></div>
    <div id="link"></div>
    <button id="copy-btn">Copy link</button>
    <button id="reset-btn" class="secondary">Send another file</button>
  </div>
</main>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'myshare.nc-config';

  var settingsCard = document.getElementById('settings-card');
  var formCard = document.getElementById('form-card');
  var result = document.getElementById('result');

  var baseUrlInput = document.getElementById('cfg-base-url');
  var usernameInput = document.getElementById('cfg-username');
  var passwordInput = document.getElementById('cfg-password');
  var targetDirInput = document.getElementById('cfg-target-dir');
  var expireDaysInput = document.getElementById('cfg-expire-days');
  var saveSettingsBtn = document.getElementById('save-settings-btn');
  var editSettingsBtn = document.getElementById('edit-settings-btn');

  var fileInput = document.getElementById('file-input');
  var pickLabel = document.getElementById('pick-label');
  var labelInput = document.getElementById('label-input');
  var sendBtn = document.getElementById('send-btn');
  var status = document.getElementById('status');
  var qrDiv = document.getElementById('qr');
  var linkDiv = document.getElementById('link');
  var copyBtn = document.getElementById('copy-btn');
  var resetBtn = document.getElementById('reset-btn');

  function loadConfig() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveConfig(cfg) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  }

  function showSettings(cfg) {
    baseUrlInput.value = (cfg && cfg.baseUrl) || '';
    usernameInput.value = (cfg && cfg.username) || '';
    passwordInput.value = (cfg && cfg.password) || '';
    targetDirInput.value = (cfg && cfg.targetDir) || '';
    expireDaysInput.value = (cfg && cfg.linkExpireDays) || '';
    settingsCard.style.display = 'block';
    formCard.style.display = 'none';
    result.style.display = 'none';
  }

  function showForm() {
    settingsCard.style.display = 'none';
    formCard.style.display = 'block';
  }

  saveSettingsBtn.addEventListener('click', function () {
    var baseUrl = baseUrlInput.value.trim().replace(/\/+$/, '');
    var username = usernameInput.value.trim();
    var password = passwordInput.value;
    if (!baseUrl || !username || !password) {
      alert('Server URL, username and app password are required.');
      return;
    }
    saveConfig({
      baseUrl: baseUrl,
      username: username,
      password: password,
      targetDir: targetDirInput.value.trim() || '/PrinterUploads',
      linkExpireDays: parseInt(expireDaysInput.value, 10) || 1,
    });
    showForm();
  });

  editSettingsBtn.addEventListener('click', function () {
    showSettings(loadConfig());
  });

  // Credentials baked in by deploy/gen-share-page.sh take precedence over
  // saved/entered ones - so a generated page needs no input at all.
  if (window.MYSHARE_CONFIG) {
    saveConfig(window.MYSHARE_CONFIG);
  }

  var existing = loadConfig();
  if (existing) {
    showForm();
  } else {
    showSettings(null);
  }

  // --- File selection ---

  fileInput.addEventListener('change', function () {
    var f = fileInput.files[0];
    if (f) {
      pickLabel.textContent = f.name;
      pickLabel.classList.add('has-file');
      sendBtn.disabled = false;
    } else {
      pickLabel.textContent = 'Choose file …';
      pickLabel.classList.remove('has-file');
      sendBtn.disabled = true;
    }
  });

  // --- Filename like internal/filenames.Generate: timestamp + safe title
  // + extension; unsafe characters are replaced with "_". ---

  function pad(n) { return String(n).padStart(2, '0'); }

  function generateFilename(label, ext) {
    var now = new Date();
    var ts = '' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) +
      '-' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
    var safe = label.trim().replace(/[^A-Za-z0-9_.-]+/g, '_').replace(/^_+|_+$/g, '');
    if (!safe) safe = 'file';
    if (ext && ext.charAt(0) !== '.') ext = '.' + ext;
    return ts + '_' + safe + (ext || '');
  }

  function splitLabel(name) {
    var dot = name.lastIndexOf('.');
    if (dot <= 0) return [name, ''];
    return [name.slice(0, dot), name.slice(dot)];
  }

  // --- Nextcloud WebDAV + OCS share API, exactly the same logic as
  // internal/nextcloud/client.go, just as a browser fetch(). ---

  function basicAuth(cfg) {
    return 'Basic ' + btoa(unescape(encodeURIComponent(cfg.username + ':' + cfg.password)));
  }

  function friendlyFetchError(err) {
    if (err instanceof TypeError) {
      return 'Connection to Nextcloud failed. Possible cause: ' +
        'this page runs on a different origin than Nextcloud and the ' +
        'server does not allow CORS access from here (see README, ' +
        'section "Directly from the phone, without any server").';
    }
    return err.message || String(err);
  }

  async function ensureRemoteDir(cfg) {
    var segments = cfg.targetDir.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean);
    var path = '';
    for (var i = 0; i < segments.length; i++) {
      path += '/' + segments[i];
      var url = cfg.baseUrl + '/remote.php/dav/files/' + encodeURIComponent(cfg.username) + path;
      var resp = await fetch(url, { method: 'MKCOL', headers: { Authorization: basicAuth(cfg) } });
      if (resp.status !== 201 && resp.status !== 405) {
        throw new Error('Failed to create target folder (' + resp.status + ')');
      }
    }
  }

  async function uploadFile(cfg, filename, file) {
    await ensureRemoteDir(cfg);
    var remotePath = cfg.targetDir.replace(/\/+$/, '') + '/' + filename;
    var url = cfg.baseUrl + '/remote.php/dav/files/' + encodeURIComponent(cfg.username) + remotePath;
    var resp = await fetch(url, { method: 'PUT', headers: { Authorization: basicAuth(cfg) }, body: file });
    if ([200, 201, 204].indexOf(resp.status) === -1) {
      throw new Error('Upload failed (' + resp.status + ')');
    }
    return remotePath;
  }

  async function createPublicLink(cfg, remotePath) {
    var url = cfg.baseUrl + '/ocs/v2.php/apps/files_sharing/api/v1/shares';
    var expireDate = new Date(Date.now() + cfg.linkExpireDays * 86400000).toISOString().slice(0, 10);
    var form = new URLSearchParams();
    form.set('path', remotePath);
    form.set('shareType', '3');
    form.set('expireDate', expireDate);

    var resp = await fetch(url, {
      method: 'POST',
      headers: {
        Authorization: basicAuth(cfg),
        'OCS-APIRequest': 'true',
        'Accept': 'application/json',
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: form.toString(),
    });
    if ([200, 201].indexOf(resp.status) === -1) {
      throw new Error('Failed to create share (' + resp.status + ')');
    }
    var json = await resp.json();
    var shareUrl = json && json.ocs && json.ocs.data && json.ocs.data.url;
    if (!shareUrl) throw new Error('Unexpected response from share API');
    return shareUrl.replace(/\/+$/, '') + '/download';
  }

  // --- UI flow ---

  sendBtn.addEventListener('click', async function () {
    var file = fileInput.files[0];
    if (!file) return;
    var cfg = loadConfig();
    if (!cfg) { showSettings(null); return; }

    var parts = splitLabel(labelInput.value.trim() || file.name);
    var filename = generateFilename(parts[0], parts[1]);

    sendBtn.disabled = true;
    status.textContent = 'Sending …';
    status.classList.remove('error');

    try {
      var remotePath = await uploadFile(cfg, filename, file);
      var link = await createPublicLink(cfg, remotePath);

      status.textContent = '';
      qrDiv.innerHTML = '';
      new QRCode(qrDiv, { text: link, width: 220, height: 220 });
      linkDiv.textContent = link;
      formCard.style.display = 'none';
      result.style.display = 'block';
    } catch (err) {
      status.textContent = friendlyFetchError(err);
      status.classList.add('error');
      sendBtn.disabled = false;
    }
  });

  copyBtn.addEventListener('click', function () {
    navigator.clipboard.writeText(linkDiv.textContent).then(function () {
      copyBtn.textContent = 'Copied!';
      setTimeout(function () { copyBtn.textContent = 'Copy link'; }, 1500);
    });
  });

  resetBtn.addEventListener('click', function () {
    fileInput.value = '';
    labelInput.value = '';
    pickLabel.textContent = 'Choose file …';
    pickLabel.classList.remove('has-file');
    sendBtn.disabled = true;
    status.textContent = '';
    result.style.display = 'none';
    showForm();
  });
})();
</script>
</body>
</html>
